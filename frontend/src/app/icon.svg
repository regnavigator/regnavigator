<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- RegNavigator 파비콘 — 에메랄드 라운드 사각 + 흰 R + 레몬 포인트 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#128058"/>
      <stop offset="1" stop-color="#0B4A34"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)"/>
  <!-- R: 세로 기둥 + 머리 루프 + 다리 -->
  <path d="M19 45 V20 H32.5 A8.5 8.5 0 0 1 32.5 37 H19"
        fill="none" stroke="#FFFFFF" stroke-width="6.5"
